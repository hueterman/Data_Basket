<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Data Basket{% endblock %} · Explorador</title>
  <style>
    :root {
      --bg: #f6f5f2;
      --panel: #ffffff;
      --border: #e2ded4;
      --text: #23201b;
      --muted: #6b665c;
      --accent: #2a6fdb;
      --accent-soft: #eaf1fc;
      --made: #2a6fdb;
      --miss: #d9822b;
      --win: #1a7f4e;
      --loss: #c0392b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      line-height: 1.45;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
    }
    header .brand {
      font-weight: 700;
      font-size: 17px;
      color: var(--text);
      text-decoration: none;
      white-space: nowrap;
    }
    header nav { display: flex; gap: 18px; flex-wrap: wrap; }
    header nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      padding: 4px 2px;
      border-bottom: 2px solid transparent;
    }
    header nav a:hover, header nav a.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
    main {
      max-width: 1080px;
      margin: 0 auto;
      padding: 24px;
    }
    h1 { font-size: 22px; margin: 0 0 4px; }
    h2 { font-size: 17px; margin: 28px 0 10px; }
    .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px 20px;
      margin-bottom: 18px;
    }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; font-size: 12.5px; text-transform: uppercase; letter-spacing: .02em; }
    tr:hover td { background: var(--accent-soft); }
    a { color: var(--accent); }
    .pill {
      display: inline-block;
      font-size: 11.5px;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }
    .pill.non-trainable { background: #fbeee2; color: #b5651d; }
    form.filters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 18px;
    }
    form.filters select, form.filters input[type=text] {
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      background: var(--panel);
      color: var(--text);
    }
    form.filters button {
      padding: 7px 14px;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: white;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }
    form.filters a.clear { color: var(--muted); font-size: 13px; text-decoration: none; }
    .pagination { display: flex; gap: 12px; align-items: center; margin-top: 14px; font-size: 13.5px; color: var(--muted); }
    .pagination a { color: var(--accent); text-decoration: none; }
    .stat-grid { display: flex; gap: 14px; flex-wrap: wrap; }
    .stat-tile {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 18px;
      min-width: 120px;
    }
    .stat-tile .n { font-size: 22px; font-weight: 700; }
    .stat-tile .label { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
    .win { color: var(--win); font-weight: 600; }
    .loss { color: var(--loss); font-weight: 600; }
    .not-played { color: var(--muted); }
    .attribution { font-size: 12px; color: var(--muted); font-style: italic; margin-top: 6px; }
    .empty { color: var(--muted); padding: 20px 0; }
    .shot-chart img { max-width: 100%; border: 1px solid var(--border); border-radius: 8px; background: white; }
    .back-link { font-size: 13.5px; margin-bottom: 12px; display: inline-block; }
    .log-box {
      background: #1b1b1b;
      color: #d7d7d7;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12.5px;
      padding: 12px 14px;
      border-radius: 8px;
      max-height: 380px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .badge-running { background: #fff4d6; color: #a06b00; }
    .badge-idle { background: #e6f4ea; color: #1a7f4e; }
    .badge-error { background: #fbe4e1; color: #c0392b; }
    .checkbox-row { display: flex; gap: 16px; flex-wrap: wrap; margin: 10px 0; }
    .checkbox-row label { display: flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer; }
    fieldset { border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; margin-bottom: 18px; }
    legend { font-weight: 600; padding: 0 6px; font-size: 14.5px; }
    .field-row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; margin: 10px 0; }
    .field-row label { font-size: 13.5px; color: var(--muted); }
    .field-row input[type=text], .field-row input[type=number] {
      padding: 6px 9px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; width: 220px;
    }
    .hint { font-size: 12px; color: var(--muted); }
    .btn-danger { border-color: var(--loss); background: var(--loss); }
    .btn-secondary { border-color: var(--border); background: var(--panel); color: var(--text); }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="{{ url_for('index') }}">🏀 Data Basket</a>
    <nav>
      <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint == 'index' }}">Resumen</a>
      <a href="{{ url_for('teams') }}" class="{{ 'active' if request.endpoint in ('teams','team_detail') }}">Equipos</a>
      <a href="{{ url_for('players') }}" class="{{ 'active' if request.endpoint in ('players','player_detail') }}">Jugadores</a>
      <a href="{{ url_for('games') }}" class="{{ 'active' if request.endpoint in ('games','game_detail') }}">Partidos</a>
      <a href="{{ url_for('ingestas') }}" class="{{ 'active' if request.endpoint == 'ingestas' }}">Ingestas</a>
    </nav>
  </header>
  <main>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="panel" style="border-color:#e2a03f; background:#fff8ec;">
          {% for m in messages %}<p style="margin:4px 0;">⚠️ {{ m }}</p>{% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
